<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASL Sports Lock</title><style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
        background: #0f172a;
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px 0;
    }

    .card {
        background: #1e293b;
        padding: 30px 24px;
        border-radius: 24px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6),
                    inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #FF5A00, #ff8a00);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 20px rgba(255, 90, 0, 0.3);
    }

    .icon svg {
        width: 30px;
        height: 30px;
        fill: #fff;
    }

    .header h2 {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        letter-spacing: 1px;
    }

    .header h2 span {
        color: #FF5A00;
    }

    .header p {
        color: #94a3b8;
        font-size: 15px;
        margin: 8px 0 24px;
    }

    /* YouTube Shorts video */
    .video-container {
        position: relative;
        width: 100%;
        max-width: 280px;
        aspect-ratio: 9 / 16;
        margin: 0 auto 24px;
        overflow: hidden;
        border-radius: 16px;
        background: #000;
        border: 1px solid #334155;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }

    .btn {
        width: 100%;
        padding: 18px;
        font-weight: 700;
        font-size: 16px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        margin-bottom: 0;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn:active {
        transform: scale(0.97);
    }

    .btn-secondary {
        background: linear-gradient(135deg, #FF5A00, #ff8a00);
        color: #fff;
        box-shadow: 0 10px 25px rgba(255, 90, 0, 0.4);
    }

    .btn-secondary:hover {
        filter: brightness(1.1);
    }
</style>

</head><body><div class="card">

    <div class="icon">
        <svg viewBox="0 0 24 24">
            <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 10 0v2h1zm-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
        </svg>
    </div>

    <div class="header">
        <h2>ASL <span>SPORTS</span></h2>
        <p>Watch the demo and get today's password</p>
    </div>

    <!-- Embedded YouTube Shorts video -->
    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/TxBEGYOjDuw"
            title="ASL SPORTS Demo Video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Get Password Button -->
    <button class="btn btn-secondary" onclick="getPassword()">
        Get Today's Password
    </button>

</div>

<script>
    function generateDailyPIN() {
        const d = new Date();
        const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
        const hash = (year * 31 + month * 12 + day * 47) * 839;
        return ((hash % 9000) + 1000).toString();
    }

    function getDailyToken() {
        const d = new Date();
        const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
        const rawToken = "ASL_" + year + "_" + month + "_" + day + "_SECURE";
        return btoa(rawToken).replace(/=/g, '');
    }

    function verifyPassword() {
        const pinInput = document.getElementById("pinInput");
        const errorText = document.getElementById("errorText");

        if (pinInput.value === generateDailyPIN()) {
            window.location.href = "app://unlock";
        } else {
            errorText.style.display = "block";
            pinInput.classList.add("shake");
            setTimeout(() => pinInput.classList.remove("shake"), 400);
            pinInput.value = "";
        }
    }

    function getPassword() {
        const todayToken = getDailyToken();

        // CHANGE THIS TO YOUR ACTUAL WEBSITE URL
        window.location.href = "https://vplink.in/st?api=39fb8caa4ade98f7b57451bd382b97e74427869e&url=https://giiithub1-pixel.github.io/MY-APPS/sktech/password.html?token=" + todayToken;
    }
</script>

</body>
</html>
