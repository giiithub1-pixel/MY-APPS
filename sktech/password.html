<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .card { 
            background: #1e293b; padding: 40px 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .icon {
            width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }
        .success-icon { background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; }
        .success-icon svg { width: 40px; height: 40px; fill: #10b981; }
        .error-icon { background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444; }
        .error-icon svg { width: 40px; height: 40px; fill: #ef4444; }
        h2 { font-size: 26px; margin-bottom: 10px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; line-height: 1.4; }
        
        .pin-display { 
            background: #0f172a; border: 2px dashed #FF5A00; border-radius: 16px; padding: 25px; margin-bottom: 30px;
        }
        .pin-display.error-box { border-color: #ef4444; }
        .pin-display h1 { font-size: 52px; letter-spacing: 12px; color: #fff; margin: 0; text-shadow: 0 0 20px rgba(255, 90, 0, 0.4); }
        .pin-display.error-box h1 { font-size: 40px; color: #ef4444; letter-spacing: 5px; text-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        
        .btn { 
            width: 100%; padding: 18px; font-weight: 700; font-size: 16px; border: none; border-radius: 16px; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(135deg, #FF5A00, #ff8a00); color: #fff; box-shadow: 0 10px 25px rgba(255, 90, 0, 0.4);
        }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="icon success-icon" id="statusIcon">
            <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        </div>
        
        <h2 id="titleText">Password Generated</h2>
        <p id="descText">Return to the ASL Sports app and enter the PIN below to unlock it for today.</p>

        <div class="pin-display" id="pinBox">
            <h1 id="pinCode">----</h1>
        </div>

        <button class="btn" onclick="copyPin()" id="copyBtn">Copy Password</button>
    </div>

    <script>
        function generateDailyPIN() {
            const d = new Date();
            const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
            const hash = (year * 31 + month * 12 + day * 47) * 839;
            return ((hash % 9000) + 1000).toString(); 
        }

        function getDailyToken() {
            const d = new Date();
            const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
            const rawToken = "ASL_" + year + "_" + month + "_" + day + "_SECURE";
            return btoa(rawToken).replace(/=/g, ''); 
        }

        const urlParams = new URLSearchParams(window.location.search);
        const providedToken = urlParams.get('token');
        const correctToken = getDailyToken();
        const dailyPassword = generateDailyPIN();

        // Check if the URL token matches today's required token
        if (providedToken === correctToken) {
            document.getElementById("pinCode").innerText = dailyPassword;
        } else {
            // Block access for bookmarks / wrong days
            document.getElementById("statusIcon").className = "icon error-icon";
            document.getElementById("statusIcon").innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
            document.getElementById("titleText").innerText = "Link Expired";
            document.getElementById("descText").innerText = "This link is no longer valid or you accessed it directly. Please open this page from inside the ASL Sports app to get today's password.";
            
            document.getElementById("pinBox").className = "pin-display error-box";
            document.getElementById("pinCode").innerText = "ERROR";
            document.getElementById("copyBtn").style.display = "none";
        }

        function copyPin() {
            if(providedToken === correctToken) {
                navigator.clipboard.writeText(dailyPassword).then(() => {
                    const btn = document.getElementById("copyBtn");
                    btn.innerText = "COPIED! ✓";
                    btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                    btn.style.boxShadow = "0 10px 25px rgba(16, 185, 129, 0.4)";
                });
            }
        }
    </script>
</body>
</html>
