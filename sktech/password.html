<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Password | ASL Sports</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .card { 
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 40px 25px; border-radius: 20px; width: 92%; max-width: 380px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1);
        }
        .icon { 
            background: rgba(255, 90, 0, 0.1); width: 70px; height: 70px; margin: 0 auto 20px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #FF5A00;
        }
        .icon svg { width: 35px; height: 35px; fill: #FF5A00; }
        h2 { font-size: 22px; margin-bottom: 10px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        
        .pin-display { 
            background: #0f172a; border: 2px dashed #FF5A00; border-radius: 15px; 
            padding: 20px; margin-bottom: 25px; position: relative;
        }
        .pin-display h1 { font-size: 48px; letter-spacing: 8px; color: #fff; margin: 0; }
        
        .btn { 
            width: 100%; padding: 16px; font-weight: 600; font-size: 16px; border: none; 
            border-radius: 12px; cursor: pointer; transition: all 0.2s ease; 
            text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(135deg, #FF5A00, #e04f00); color: #fff; 
            box-shadow: 0 10px 20px -10px #FF5A00;
        }
        .btn:active { transform: translateY(2px); }
        .btn:hover { opacity: 0.9; }
        
        .footer { margin-top: 25px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">
            <!-- Lock SVG Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 10 0v2h1zm-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
            </svg>
        </div>
        
        <h2>Today's App Password</h2>
        <p>Copy the password below, go back to the ASL Sports app, and paste it to unlock.</p>

        <div class="pin-display">
            <h1 id="pinCode">----</h1>
        </div>

        <button class="btn" onclick="copyPin()" id="copyBtn">Copy Password</button>

        <div class="footer">
            This password automatically changes daily at midnight.
        </div>
    </div>

    <script>
        // Automatic Daily Password Generator Logic (Exactly the same as index.html)
        function generateDailyPIN() {
            const d = new Date();
            const year = d.getFullYear();
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const hash = (year * 31 + month * 12 + day * 47) * 839;
            return ((hash % 9000) + 1000).toString(); 
        }

        // Display the PIN on page load
        const todayPin = generateDailyPIN();
        document.getElementById("pinCode").innerText = todayPin;

        // Copy functionality for mobile users
        function copyPin() {
            navigator.clipboard.writeText(todayPin).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerText = "Copied to Clipboard! ✓";
                btn.style.background = "#10b981"; // Turns green on success
                btn.style.boxShadow = "0 10px 20px -10px #10b981";
                
                setTimeout(() => {
                    btn.innerText = "Copy Password";
                    btn.style.background = "linear-gradient(135deg, #FF5A00, #e04f00)";
                    btn.style.boxShadow = "0 10px 20px -10px #FF5A00";
                }, 3000);
            });
        }
    </script>
</body>
</html>
